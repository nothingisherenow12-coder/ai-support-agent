[project]
name = "ai-support-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "python-multipart",
    "groq",
    "google-genai",
    "pypdf",
    "pgvector",
]

[tool.vercel]
entrypoint = "app.main:app"